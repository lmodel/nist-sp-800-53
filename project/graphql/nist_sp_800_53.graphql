# metamodel_version: 1.12.0
# version: 5.2.0
enum Sp80053AssessmentMethodKind
  {
    EXAMINE
    INTERVIEW
    TEST
  }

enum Sp80053BaselineLevel
  {
    LOW
    MODERATE
    HIGH
    PRIVACY
  }

enum Sp80053ControlStatus
  {
    WITHDRAWN
  }

enum Sp80053ImplementationLevel
  {
    ORGANIZATION
    SYSTEM
  }

enum Sp80053SelectionCardinality
  {
    ONE
    ONE_OR_MORE
  }

type Sp80053AssessmentMethod
  {
    assessmentMethod: Sp80053AssessmentMethodKind!
    assessmentObjects: [String]!
  }

type Sp80053AssessmentObjective
  {
    objectiveLabel: String!
    objectiveText: String
    subObjectives: [Sp80053AssessmentObjective]
  }

type Sp80053Baseline
  {
    baselineLevel: Sp80053BaselineLevel!
    title: String!
    baselineControls: [Sp80053ControlOrEnhancementIdentifier]!
  }

type Sp80053Catalog
  {
    catalogRelease: String!
    controlFamilies: [Sp80053Family]!
    controlBaselines: [Sp80053Baseline]
    catalogReferences: [Sp80053Reference]
  }

type Sp80053Control
  {
    controlIdentifier: Sp80053ControlIdentifier!
    title: String!
    controlStatement: Sp80053Statement
    controlDiscussion: String
    controlParameters: [Sp80053Parameter]
    relatedControlIds: [Sp80053ControlOrEnhancementIdentifier]
    controlReferences: [String]
    assessmentObjective: Sp80053AssessmentObjective
    assessmentMethods: [Sp80053AssessmentMethod]
    controlStatus: Sp80053ControlStatus
    incorporatedInto: [Sp80053WithdrawalTarget]
    movedTo: [Sp80053ControlOrEnhancementIdentifier]
    withdrawalReason: String
    implementationLevel: [Sp80053ImplementationLevel]
    contributesToAssurance: Boolean
    controlEnhancements: [Sp80053ControlEnhancement]
  }

type Sp80053ControlEnhancement
  {
    enhancementId: Sp80053EnhancementIdentifier!
    title: String!
    controlStatement: Sp80053Statement
    controlDiscussion: String
    controlParameters: [Sp80053Parameter]
    relatedControlIds: [Sp80053ControlOrEnhancementIdentifier]
    controlReferences: [String]
    assessmentObjective: Sp80053AssessmentObjective
    assessmentMethods: [Sp80053AssessmentMethod]
    controlStatus: Sp80053ControlStatus
    incorporatedInto: [Sp80053WithdrawalTarget]
    movedTo: [Sp80053ControlOrEnhancementIdentifier]
    withdrawalReason: String
    implementationLevel: [Sp80053ImplementationLevel]
    contributesToAssurance: Boolean
    requiredControls: [Sp80053ControlOrEnhancementIdentifier]
  }

type Sp80053Family
  {
    familyId: Sp80053FamilyIdentifier!
    title: String!
    description: String
    familyControls: [Sp80053Control]
  }

type Sp80053Parameter
  {
    parameterId: Sp80053ParameterIdentifier!
    assessmentLabel: String
    parameterLabel: String
    parameterGuidelines: [String]
    selectionChoices: [String]
    selectionCardinality: Sp80053SelectionCardinality
    aggregatedParameters: [Sp80053ParameterIdentifier]
    alternativeIdentifiers: [Sp80053ParameterIdentifier]
    alternativeLabel: String
  }

type Sp80053Reference
  {
    referenceLabel: String!
    referenceCitation: String
    referenceUrl: String
  }

type Sp80053Statement
  {
    statementItems: [Sp80053StatementItem]
    statementText: String
  }

type Sp80053StatementItem
  {
    statementItems: [Sp80053StatementItem]
    itemLabel: String!
    itemText: String!
  }

# linkml-lint reads this file from the directory `just lint` runs in.
# The recommended rules apply, with one setting changed: standard_naming
# expects permissible values in upper case rather than snake case. The
# enums' values are the catalog's own where it has them, the assessment
# methods EXAMINE, INTERVIEW and TEST, so that a method compares with NIST's
# catalog without translating, and the other enums follow the same form.
# Class, slot and type names keep the rule's usual forms.
extends: recommended
rules:
  standard_naming:
    level: error
    permissible_values_upper_case: true

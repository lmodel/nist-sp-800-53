[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
# Named like lmodel/slsa's slsa-linkml, so the PyPI name says what it holds;
# the import package stays nist_sp_800_53. PyPI publishing is off.
name = "nist-sp-800-53-linkml"
description = "NIST SP 800-53 Security and Privacy Controls Release 5.2.0 with SP 800-53A and SP 800-53B (LinkML)"
authors = [
  {name = "Noel McLoughlin", email = "noel.mcloughlin@gmail.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.9.4",
]

[dependency-groups]
dev = [
    "linkml>=1.9.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nist_sp_800_53"]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
exclude = [
    "src/nist_sp_800_53/_version.py",
]
# Set oldest supported Python version
target-version = "py310"

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/nist_sp_800_53/datamodel/nist_sp_800_53_pydantic.py",
  "src/nist_sp_800_53/datamodel/nist_sp_800_53.py",
  # NIST's catalog and baselines and the neighbours' adapt copies, copied as
  # published, and files copied in by the KTL sidecar sync or written by npm,
  # not by hand.
  "src/nist_sp_800_53/schema/oscal-content/*",
  "tests/neighbours/*",
  ".lokf/scripts/*",
  "website/package-lock.json",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"

[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/nist_sp_800_53/datamodel/nist_sp_800_53_pydantic.py",
  "src/nist_sp_800_53/datamodel/nist_sp_800_53.py",
  "src/nist_sp_800_53/schema/oscal-content/*",
  "tests/neighbours/*",
  ".lokf/scripts/*",
  "website/package-lock.json",
]

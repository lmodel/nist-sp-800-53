    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  Sp80053ControlStatus:
    name: Sp80053ControlStatus
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053ControlStatus
    description: 'The one status the catalog marks: withdrawn. A control or enhancement
      that Revision 5 keeps carries no status.'
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    permissible_values:
      WITHDRAWN:
        text: WITHDRAWN
        description: Revision 5 withdrew the control or enhancement; incorporated_into,
          moved_to or withdrawal_reason says where it went.
  Sp80053ImplementationLevel:
    name: Sp80053ImplementationLevel
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053ImplementationLevel
    description: Who implements a control or enhancement, as NIST's reference data
      marks it.
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    permissible_values:
      ORGANIZATION:
        text: ORGANIZATION
        description: The organization implements it, through its processes and people.
      SYSTEM:
        text: SYSTEM
        description: The system implements it, through its mechanisms.
  Sp80053SelectionCardinality:
    name: Sp80053SelectionCardinality
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053SelectionCardinality
    description: How many of a selection's choices the organization picks.
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    permissible_values:
      ONE:
        text: ONE
        description: Exactly one choice, which the catalog leaves unwritten.
      ONE_OR_MORE:
        text: ONE_OR_MORE
        description: One or more choices, which the publication writes as Selection
          (one or more).
  Sp80053AssessmentMethodKind:
    name: Sp80053AssessmentMethodKind
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053AssessmentMethodKind
    description: The three assessment methods of SP 800-53A, as its catalog writes
      them.
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    permissible_values:
      EXAMINE:
        text: EXAMINE
        description: Review, inspect, observe, study or analyze specifications, mechanisms
          or activities.
      INTERVIEW:
        text: INTERVIEW
        description: Hold discussions with individuals or groups.
      TEST:
        text: TEST
        description: Exercise mechanisms or activities under specified conditions.
  Sp80053BaselineLevel:
    name: Sp80053BaselineLevel
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053BaselineLevel
    description: The four control baselines SP 800-53B defines.
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    permissible_values:
      LOW:
        text: LOW
        description: The baseline for a low-impact system.
      MODERATE:
        text: MODERATE
        description: The baseline for a moderate-impact system.
      HIGH:
        text: HIGH
        description: The baseline for a high-impact system.
      PRIVACY:
        text: PRIVACY
        description: The privacy baseline, which applies regardless of impact level.
slots:
  title:
    name: title
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/title
    description: The name SP 800-53 gives the family, control or control enhancement,
      or SP 800-53B gives the baseline.
    comments:
    - It means what LOKF's title means and carries the same IRI, so lokf adapt folds
      it into LOKF's slot and a knowledge bundle reads one title key.
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    mappings:
    - schema:name
    slot_uri: schema:name
    owner: Sp80053Baseline
    domain_of:
    - Sp80053Family
    - Sp80053Control
    - Sp80053ControlEnhancement
    - Sp80053Baseline
    range: string
  description:
    name: description
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/description
    description: What the family is about, in the words of whoever records it. SP
      800-53 gives the Program Management family an overview of its own, and the other
      families none.
    comments:
    - It means what LOKF's description means and carries the same IRI, so lokf adapt
      folds it into LOKF's slot and a knowledge bundle reads one description key.
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    mappings:
    - schema:description
    slot_uri: schema:description
    owner: Sp80053Family
    domain_of:
    - Sp80053Family
    range: string
  control_statement:
    name: control_statement
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/control_statement
    description: 'The control statement: what the control or enhancement requires,
      as one text, a lettered or numbered list of items, or both.'
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    slot_uri: nist_sp_800_53:control_statement
    owner: Sp80053ControlEnhancement
    domain_of:
    - Sp80053Control
    - Sp80053ControlEnhancement
    range: Sp80053Statement
    inlined: true
    inlined_as_list: true
  control_discussion:
    name: control_discussion
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/control_discussion
    description: 'The discussion that follows the statement: context and guidance
      that help apply the control, which the publication does not require.'
    comments:
    - Where the catalog links a control or a statement item inside the text, a derivation
      keeps the link's text, which is the identifier as the publication prints it,
      and where it links a reference, the reference's label in brackets.
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    slot_uri: nist_sp_800_53:control_discussion
    owner: Sp80053ControlEnhancement
    domain_of:
    - Sp80053Control
    - Sp80053ControlEnhancement
    range: string
  control_parameters:
    name: control_parameters
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/control_parameters
    description: The organization-defined parameters the statement leaves to the organization,
      in the order the catalog gives them.
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    slot_uri: nist_sp_800_53:control_parameters
    owner: Sp80053ControlEnhancement
    domain_of:
    - Sp80053Control
    - Sp80053ControlEnhancement
    range: Sp80053Parameter
    multivalued: true
    inlined: true
    inlined_as_list: true
  related_control_ids:
    name: related_control_ids
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/related_control_ids
    description: The controls and enhancements the publication lists as related, by
      identifier.
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    slot_uri: nist_sp_800_53:related_control_ids
    owner: Sp80053ControlEnhancement
    domain_of:
    - Sp80053Control
    - Sp80053ControlEnhancement
    range: sp80053_control_or_enhancement_identifier
    multivalued: true
  control_references:
    name: control_references
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/control_references
    description: The publications the control or enhancement cites, by the labels
      the catalog's references carry, such as SP 800-12 or OMB A-130.
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    slot_uri: nist_sp_800_53:control_references
    owner: Sp80053ControlEnhancement
    domain_of:
    - Sp80053Control
    - Sp80053ControlEnhancement
    range: string
    multivalued: true
    pattern: \S
  assessment_objective:
    name: assessment_objective
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/assessment_objective
    description: 'The assessment objective SP 800-53A gives the control or enhancement:
      the determination statements an assessor checks, nested as the statement''s
      items are.'

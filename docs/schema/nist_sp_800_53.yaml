types:
  sp80053_family_identifier:
    name: sp80053_family_identifier
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053FamilyIdentifier
    description: The two letters that name one of the twenty control families, such
      as AC for Access Control.
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(AC|AT|AU|CA|CM|CP|IA|IR|MA|MP|PE|PL|PM|PS|PT|RA|SA|SC|SI|SR)$
  sp80053_control_identifier:
    name: sp80053_control_identifier
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053ControlIdentifier
    description: 'A control''s identifier: its family''s letters, a hyphen and the
      control''s number within the family, such as AC-2.'
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(AC|AT|AU|CA|CM|CP|IA|IR|MA|MP|PE|PL|PM|PS|PT|RA|SA|SC|SI|SR)-[1-9][0-9]*$
  sp80053_enhancement_identifier:
    name: sp80053_enhancement_identifier
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053EnhancementIdentifier
    description: 'A control enhancement''s identifier: its control''s identifier and
      the enhancement''s number in parentheses, such as AC-2(1).'
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(AC|AT|AU|CA|CM|CP|IA|IR|MA|MP|PE|PL|PM|PS|PT|RA|SA|SC|SI|SR)-[1-9][0-9]*\([1-9][0-9]*\)$
  sp80053_control_or_enhancement_identifier:
    name: sp80053_control_or_enhancement_identifier
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053ControlOrEnhancementIdentifier
    description: The identifier of a control or of a control enhancement, such as
      AC-2 or AC-2(1), where the publication cites either.
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(AC|AT|AU|CA|CM|CP|IA|IR|MA|MP|PE|PL|PM|PS|PT|RA|SA|SC|SI|SR)-[1-9][0-9]*(\([1-9][0-9]*\))?$
  sp80053_withdrawal_target:
    name: sp80053_withdrawal_target
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053WithdrawalTarget
    description: 'Where a withdrawn control or enhancement was incorporated, as the
      publication names it: a control or enhancement, such as AC-2 or AC-2(1), one
      item of a control''s statement, such as AC-2k, or a whole family, such as SR.'
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(AC|AT|AU|CA|CM|CP|IA|IR|MA|MP|PE|PL|PM|PS|PT|RA|SA|SC|SI|SR)(-[1-9][0-9]*(\([1-9][0-9]*\))?([a-z](\.[1-9][0-9]*)*|\([a-z]\)(\([1-9][0-9]*\))*)?)?$
  sp80053_parameter_identifier:
    name: sp80053_parameter_identifier
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053ParameterIdentifier
    description: 'The identifier NIST''s catalog gives an organization-defined parameter,
      in lower case: the zero-padded control identifier, _odp and the parameter''s
      number, such as ac-02_odp.01, or, for a parameter that aggregates several, the
      control identifier, _prm_ and a number, such as ac-1_prm_1.'
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[a-z]{2}-[0-9]{2}(\.[0-9]{2})?_odp(\.[0-9]{2})?$|^[a-z]{2}-[1-9][0-9]*(\.[1-9][0-9]*)?_prm_[1-9][0-9]*$
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:

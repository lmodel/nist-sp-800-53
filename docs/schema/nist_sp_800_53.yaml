classes:
  Sp80053Catalog:
    name: Sp80053Catalog
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053Catalog
    description: 'One release of the control catalog as a whole: its families, each
      holding its controls and their enhancements, the baselines that select from
      them, and the publications the controls cite.'
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    see_also:
    - https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
    exact_mappings:
    - nist_sp_800_53:Catalog
    broad_mappings:
    - oscal:Catalog
    slots:
    - sp80053Catalog__catalog_release
    - sp80053Catalog__control_families
    - sp80053Catalog__control_baselines
    - sp80053Catalog__catalog_references
    attributes:
      catalog_release:
        name: catalog_release
        description: The release of Revision 5 the catalog carries, as NIST numbers
          it, such as 5.2.0.
        required: true
        pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
      control_families:
        name: control_families
        description: The twenty control families, in the order SP 800-53 gives them.
        range: Sp80053Family
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      control_baselines:
        name: control_baselines
        description: The control baselines of SP 800-53B that select from the catalog.
        range: Sp80053Baseline
        multivalued: true
        inlined: true
        inlined_as_list: true
      catalog_references:
        name: catalog_references
        description: The publications the controls cite, as the catalog's references
          list them.
        range: Sp80053Reference
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_sp_800_53:Catalog
    tree_root: true
  Sp80053Family:
    name: Sp80053Family
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053Family
    description: One of the twenty families SP 800-53 sorts its controls into, such
      as Access Control or Supply Chain Risk Management.
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    see_also:
    - https://csrc.nist.gov/projects/risk-management/sp800-53-controls
    exact_mappings:
    - nist_sp_800_53:Family
    broad_mappings:
    - oscal:Group
    slots:
    - title
    - description
    - sp80053Family__family_id
    - sp80053Family__family_controls
    attributes:
      family_id:
        name: family_id
        description: The family's two letters, such as AC for Access Control.
        range: sp80053_family_identifier
        required: true
      family_controls:
        name: family_controls
        description: The controls of the family. A knowledge bundle relates a control
          to its family with isPartOf instead.
        range: Sp80053Control
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_sp_800_53:Family
  Sp80053Control:
    name: Sp80053Control
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053Control
    description: 'A security or privacy control: a safeguard with an identifier, a
      statement of what it requires, a discussion, parameters the organization defines,
      related controls, references, the assessment objective and methods SP 800-53A
      gives it, and its enhancements. A control Revision 5 withdrew keeps its identifier
      and says where it went.'
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    see_also:
    - https://csrc.nist.gov/projects/risk-management/sp800-53-controls
    exact_mappings:
    - nist_sp_800_53:Control
    broad_mappings:
    - oscal:Control
    slots:
    - title
    - control_statement
    - control_discussion
    - control_parameters
    - related_control_ids
    - control_references
    - assessment_objective
    - assessment_methods
    - control_status
    - incorporated_into
    - moved_to
    - withdrawal_reason
    - implementation_level
    - contributes_to_assurance
    - sp80053Control__control_identifier
    - sp80053Control__control_enhancements
    attributes:
      control_identifier:
        name: control_identifier
        description: The control's identifier, such as AC-2.
        range: sp80053_control_identifier
        required: true
      control_enhancements:
        name: control_enhancements
        description: The control's enhancements. A knowledge bundle relates an enhancement
          to its control with isPartOf instead.
        range: Sp80053ControlEnhancement
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_sp_800_53:Control
  Sp80053ControlEnhancement:
    name: Sp80053ControlEnhancement
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053ControlEnhancement
    description: 'A control enhancement: added functionality or strength for a control,
      with an identifier of its own, which the publication and other documents cite
      apart from the control. It carries what a control carries, and names the control
      or enhancement it requires.'
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    see_also:
    - https://csrc.nist.gov/projects/risk-management/sp800-53-controls
    exact_mappings:
    - nist_sp_800_53:ControlEnhancement
    broad_mappings:
    - oscal:Control
    slots:
    - title
    - control_statement
    - control_discussion
    - control_parameters
    - related_control_ids
    - control_references
    - assessment_objective
    - assessment_methods
    - control_status
    - incorporated_into
    - moved_to
    - withdrawal_reason
    - implementation_level
    - contributes_to_assurance
    - sp80053ControlEnhancement__enhancement_id
    - sp80053ControlEnhancement__required_controls
    attributes:
      enhancement_id:
        name: enhancement_id
        description: The enhancement's identifier, such as AC-2(1).
        range: sp80053_enhancement_identifier
        required: true
      required_controls:
        name: required_controls
        description: The control, or in one case the enhancement, that must be implemented
          for the enhancement to apply, as NIST's catalog links it; its own control
          for every enhancement but SC-42(2), which requires SC-42(1).
        range: sp80053_control_or_enhancement_identifier
        multivalued: true
    class_uri: nist_sp_800_53:ControlEnhancement
  Sp80053Statement:
    name: Sp80053Statement
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053Statement
    description: 'A control statement: the text of what a control or enhancement requires,
      and the items it is divided into.'
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    see_also:
    - https://csrc.nist.gov/projects/risk-management/sp800-53-controls
    exact_mappings:
    - nist_sp_800_53:Statement
    broad_mappings:
    - oscal:Part
    slots:
    - statement_items
    - sp80053Statement__statement_text
    attributes:
      statement_text:
        name: statement_text
        description: 'The statement''s own text, before any items. A placeholder of
          the form {{ insert: param, <identifier> }} marks where an organization-defined
          parameter is inserted.'
    class_uri: nist_sp_800_53:Statement
  Sp80053StatementItem:
    name: Sp80053StatementItem
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053StatementItem
    description: One lettered or numbered item of a control statement, which may hold
      items of its own.
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    see_also:
    - https://csrc.nist.gov/projects/risk-management/sp800-53-controls
    exact_mappings:
    - nist_sp_800_53:StatementItem
    broad_mappings:
    - oscal:Part
    slots:
    - statement_items
    - sp80053StatementItem__item_label
    - sp80053StatementItem__item_text
    attributes:
      item_label:
        name: item_label
        description: The item's label as the publication prints it, such as a., 1.
          or (a).
        required: true
        pattern: ^(([a-z]|[1-9][0-9]*)\.|\(([a-z]|[1-9][0-9]*)\))$
      item_text:
        name: item_text
        description: The item's text, with the same placeholders for parameters as
          the statement's text.
        required: true
    class_uri: nist_sp_800_53:StatementItem
  Sp80053Parameter:
    name: Sp80053Parameter
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053Parameter
    description: 'An organization-defined parameter: a value the control statement
      leaves to the organization, either an assignment the organization fills in or
      a selection from the choices the publication lists. SP 800-53A gives each a
      label and a guideline of its own.'
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    see_also:
    - https://doi.org/10.6028/NIST.SP.800-53Ar5
    exact_mappings:
    - nist_sp_800_53:Parameter
    broad_mappings:
    - oscal:OscalParameter
    slots:
    - sp80053Parameter__parameter_id
    - sp80053Parameter__assessment_label
    - sp80053Parameter__parameter_label
    - sp80053Parameter__parameter_guidelines
    - sp80053Parameter__selection_choices
    - sp80053Parameter__selection_cardinality
    - sp80053Parameter__aggregated_parameters
    - sp80053Parameter__alternative_identifiers
    - sp80053Parameter__alternative_label
    attributes:
      parameter_id:
        name: parameter_id
        description: The parameter's identifier in NIST's catalog, such as ac-02_odp.01.
        range: sp80053_parameter_identifier
        required: true
      assessment_label:
        name: assessment_label
        description: The label SP 800-53A gives the parameter, such as AC-02_ODP[01].
          A parameter that aggregates several has none.
        pattern: ^[A-Z]{2}-[0-9]{2}\S*_ODP(\[[0-9]{2}\])?$
      parameter_label:
        name: parameter_label
        description: For an assignment, what the organization defines, such as personnel
          or roles.
      parameter_guidelines:
        name: parameter_guidelines
        description: The guidelines that say what a value must settle, such as that
          the frequency of a review is defined.
        multivalued: true
      selection_choices:
        name: selection_choices
        description: For a selection, the choices the publication lists, in order.
        multivalued: true
      selection_cardinality:
        name: selection_cardinality
        description: For a selection, how many choices the organization picks. The
          catalog marks one or more and leaves exactly one unwritten.
        range: Sp80053SelectionCardinality
      aggregated_parameters:
        name: aggregated_parameters
        description: For a parameter that stands for several, the parameters it aggregates,
          by identifier.
        range: sp80053_parameter_identifier
        multivalued: true
      alternative_identifiers:
        name: alternative_identifiers
        description: The identifiers an earlier release of the catalog gave the parameter,
          such as ac-1_prm_2 for ac-01_odp.03.
        range: sp80053_parameter_identifier
        multivalued: true
      alternative_label:
        name: alternative_label
        description: The label SP 800-53 prints where it differs from the one SP 800-53A
          gives.
    class_uri: nist_sp_800_53:Parameter
  Sp80053AssessmentObjective:
    name: Sp80053AssessmentObjective
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053AssessmentObjective
    description: 'An assessment objective of SP 800-53A: a determination statement
      an assessor checks, or a heading that groups the determination statements of
      one item of the control statement.'
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    see_also:
    - https://doi.org/10.6028/NIST.SP.800-53Ar5
    exact_mappings:
    - nist_sp_800_53:AssessmentObjective
    broad_mappings:
    - oscal:Part
    slots:
    - sp80053AssessmentObjective__objective_label
    - sp80053AssessmentObjective__objective_text
    - sp80053AssessmentObjective__sub_objectives
    attributes:
      objective_label:
        name: objective_label
        description: The label SP 800-53A gives the objective, such as AC-02a.[01].
        required: true
        pattern: ^[A-Z]{2}-[0-9]{2}
      objective_text:
        name: objective_text
        description: The determination statement, with the same placeholders for parameters
          as the control statement. A heading has none.
      sub_objectives:
        name: sub_objectives
        description: The objectives grouped under this one, in order.
        range: Sp80053AssessmentObjective
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_sp_800_53:AssessmentObjective
  Sp80053AssessmentMethod:
    name: Sp80053AssessmentMethod
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053AssessmentMethod
    description: 'One assessment method SP 800-53A gives a control or enhancement,
      with the objects an assessor selects from: documents and records to examine,
      people to interview, or mechanisms and activities to test.'
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    see_also:
    - https://doi.org/10.6028/NIST.SP.800-53Ar5
    exact_mappings:
    - nist_sp_800_53:AssessmentMethod
    broad_mappings:
    - oscal:Part
    slots:
    - sp80053AssessmentMethod__assessment_method
    - sp80053AssessmentMethod__assessment_objects
    attributes:
      assessment_method:
        name: assessment_method
        description: Which of the three methods this is.
        range: Sp80053AssessmentMethodKind
        required: true
      assessment_objects:
        name: assessment_objects
        description: The objects the method is applied to, in the order the publication
          lists them.
        required: true
        multivalued: true
        pattern: \S
    class_uri: nist_sp_800_53:AssessmentMethod
  Sp80053Reference:
    name: Sp80053Reference
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053Reference
    description: 'A publication the controls cite, as the catalog''s references list
      it: its label, its citation and its address.'
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    see_also:
    - https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
    exact_mappings:
    - nist_sp_800_53:Reference
    broad_mappings:
    - oscal:Resource
    slots:
    - sp80053Reference__reference_label
    - sp80053Reference__reference_citation
    - sp80053Reference__reference_url
    attributes:
      reference_label:
        name: reference_label
        description: The label the controls cite the publication by, such as SP 800-12.
        required: true
        pattern: \S
      reference_citation:
        name: reference_citation
        description: The citation, as the catalog prints it.
      reference_url:
        name: reference_url
        description: The address the catalog gives for the publication.
        range: uri
    class_uri: nist_sp_800_53:Reference
  Sp80053Baseline:
    name: Sp80053Baseline
    definition_uri: https://w3id.org/lmodel/nist-sp-800-53/Sp80053Baseline
    description: 'One of the four control baselines SP 800-53B defines: the controls
      and enhancements selected for systems at the low, moderate or high impact level,
      or for privacy.'
    from_schema: https://w3id.org/lmodel/nist-sp-800-53
    see_also:
    - https://doi.org/10.6028/NIST.SP.800-53B
    exact_mappings:
    - nist_sp_800_53:Baseline
    broad_mappings:
    - oscal:Profile
    slots:
    - title
    - sp80053Baseline__baseline_level
    - sp80053Baseline__baseline_controls
    attributes:
      baseline_level:
        name: baseline_level
        description: Which of the four baselines this is.
        range: Sp80053BaselineLevel
        required: true
      baseline_controls:
        name: baseline_controls
        description: The controls and enhancements the baseline selects, by identifier,
          in the order the catalog gives them.
        range: sp80053_control_or_enhancement_identifier
        required: true
        multivalued: true
    class_uri: nist_sp_800_53:Baseline

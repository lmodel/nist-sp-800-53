name: nist_sp_800_53
annotations:
  cprt_framework_version:
    tag: cprt_framework_version
    value: SP_800_53_5_2_0
  publication_date:
    tag: publication_date
    value: 2025-08
  oscal_content_tag:
    tag: oscal_content_tag
    value: v1.6.0
  oscal_content_commit:
    tag: oscal_content_commit
    value: f0de6d8d8c059d374f15e0ae07508d82e370fc1d
description: 'A LinkML model of the security and privacy controls that NIST Special
  Publication 800-53, Revision 5, defines at Release 5.2.0: its twenty control families,
  their controls and control enhancements, each with its statement, discussion, organization-defined
  parameters, related controls and references; the assessment objectives and methods
  that SP 800-53A gives each control; and the four control baselines of SP 800-53B.'
title: NIST SP 800-53 Security and Privacy Controls, Release 5.2.0
comments:
- The version is the release of Revision 5 that the catalog carries, 5.2.0 of August
  2025, and publication_date is that release's date; Revision 5 itself was published
  in September 2020 and updated in December 2020. source is the publication's digital
  object identifier. NIST's Cybersecurity and Privacy Reference Tool names the same
  release SP_800_53_5_2_0, and the catalog and the four baseline profiles NIST publishes
  for it in usnistgov/oscal-content are copied to src/nist_sp_800_53/schema/oscal-content/
  at the tag and commit in the annotations. scripts/check_upstream_release.py reads
  the same pins and reports when NIST publishes a newer edition or changes a copied
  file. The release tags are the schema's own versions.
- SP 800-53, SP 800-53A and SP 800-53B are works of the United States Government and
  are not subject to copyright in the United States. The descriptions here are this
  project's own words; NIST's text of each control, parameter, objective and method
  stays in the catalog copy.
- NIST's catalog renders each family as an OSCAL group, each control and control enhancement
  as an OSCAL control, each statement, discussion, assessment objective and assessment
  method as a part, each organization-defined parameter as a parameter, each reference
  as a back-matter resource, and each baseline as a profile. The broad_mappings name
  those lmodel/oscal classes.
source: https://doi.org/10.6028/NIST.SP.800-53r5
see_also:
- https://lmodel.github.io/nist-sp-800-53
- https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
- https://csrc.nist.gov/News/2025/nist-releases-revision-to-sp-800-53-controls
- https://doi.org/10.6028/NIST.SP.800-53Ar5
- https://doi.org/10.6028/NIST.SP.800-53B
- https://github.com/usnistgov/oscal-content/tree/v1.6.0/nist.gov/SP800-53/rev5
